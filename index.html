<style>

line)}.step:last-child{border:0}.step-number{border:1px solid var(--line);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:12px;flex-shrink:0;color:var(--accent)}.step p{margin:3px 0 0;font-size:13px;color:var(--muted)}.step strong{font-size:15px;font-weight:500}.ribbon{display:flex;gap:22px;margin-top:32px;flex-wrap:wrap;color:var(--muted);font-size:12px}.ribbon span{display:flex;align-items:center;gap:7px}.ribbon b{font-size:15px;font-weight:400;color:var(--accent)}.wave{width:100%;height:86px;margin:27px 0 0;opacity:.6}.notice{border-left:2px solid var(--accent);background:#1a2829;padding:13px 16px;font-size:13px;color:#c5d2cc;margin:22px 0;border-radius:0 7px 7px 0}.notice.warn{border-color:var(--warn);color:var(--warn);background:#282820}.notice.error{border-color:var(--bad);color:var(--bad);background:#2b2222}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 0}button,.button{font:inherit;font-size:14px;font-weight:600;border:1px solid transparent;padding:12px 20px;border-radius:7px;background:var(--accent);color:#142723;cursor:pointer;display:inline-block;text-decoration:none}button:hover,.button:hover{filter:brightness(1.08)}button:disabled{opacity:.38;cursor:not-allowed;filter:none}button.secondary,.button.secondary{background:transparent;color:var(--ink);border-color:var(--line)}button.text-button{background:none;color:var(--muted);padding:0;font-weight:400;font-size:12px;border:0}button.danger{background:transparent;border-color:var(--bad);color:var(--bad)}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}label.field{font-size:13px;display:block;color:var(--muted);margin:15px 0 7px}input[type=text],input[type=url]{font:inherit;color:var(--ink);background:#10191c;border:1px solid var(--line);border-radius:6px;padding:12px;width:100%}.check{display:flex;gap:10px;font-size:13px;align-items:flex-start;margin:18px 0}.check input{margin-top:6px;accent-color:var(--accent);flex-shrink:0}.flow{max-width:720px;margin:auto}.flow .panel{margin-top:26px}.breadcrumb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:30px}.breadcrumb strong{color:var(--accent);font-weight:600}.keys{display:grid;grid-template-columns:45px 1fr;gap:14px;align-items:start;padding:18px 0;border-bottom:1px solid var(--line)}.keys:last-child{border:0}.keys p{font-size:14px;color:var(--muted);margin:4px 0 0}kbd{font:12px ui-monospace,monospace;background:#10191c;border:1px solid #52605f;border-bottom-width:3px;border-radius:5px;padding:4px 8px;white-space:nowrap}.meter{height:14px;background:#0d1517;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:25px 0 10px}.meter>span{display:block;height:100%;background:var(--accent);width:0;transition:width .06s linear}.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0;list-style:none;font-size:12px;color:var(--muted)}.scale li{padding:9px 8px;background:#10191c;border-radius:6px}.scale b{color:var(--ink);margin-right:6px}audio{width:100%;margin:12px 0}footer{color:var(--muted);font-size:11px;border-top:1px solid var(--line)}body.listening{background:#000}body.listening header,body.listening footer{visibility:hidden}body.listening main{min-height:80vh;display:grid;place-items:center}.listening .flow{text-align:center;max-width:600px}.listening h1{font-size:30px;color:#858e8e}.listening .eyebrow{color:#5b6666}.listening .muted{color:#586161}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}dialog{max-width:820px;width:calc(100% - 36px);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:15px;padding:32px;max-height:90vh;overflow:auto}dialog::backdrop{background:#000a}.session-item{border-top:1px solid var(--line);padding:15px 0;overflow-wrap:anywhere}.session-item .row{margin-top:10px}.error-text{color:var(--bad);font-size:1 /* Participant instructions */
header,footer{max-width:920px}main{max-width:920px;padding-top:42px}.flow{max-width:720px}
h1{font-family:var(--sans);font-size:32px;font-weight:500;letter-spacing:-.025em;line-height:1.3}
h2{font-size:19px;font-weight:500}.wordmark{font-size:15px;letter-spacing:0}.panel{padding:25px;border-radius:9px;box-shadow:none}
.section-heading,.kss-scale{margin-top:30px}.scale{display:block;list-style:none;font-size:14px;margin:12px 0 24px}
.scale li{display:flex;gap:14px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);border-radius:0;background:transparent}
.scale b{min-width:15px;margin:0;font-weight:600}.examples{padding-left:18px;border-left:1px solid var(--line);margin:22px 0}
.examples p{font-size:15px}.keys{grid-template-columns:28px 1fr}.breadcrumb{letter-spacing:.08em}
@media(max-width:650px){h1{font-size:28px}.panel{padding:20px}header,footer{padding:18px 22px}main{padding-top:30px}}

/* Colores. */
:root{--bg:#3a3c62;--panel:#303252;--ink:#faf8f2;--muted:#d1d3e2;--accent:#d0eee2;--line:#66698b;--sans:Helvetica,"Helvetica Neue",Arial,sans-serif;--serif:Helvetica,"Helvetica Neue",Arial,sans-serif}
body,button,input,select,textarea{font-family:var(--sans)}
select{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;background:#282b4a;color:var(--ink)}
select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
header,footer{max-width:1000px}main{max-width:1000px;padding-top:44px}
.welcome-layout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:44px;align-items:start;max-width:900px;margin:auto}
.welcome-layout h1{font-size:35px;margin-top:0;line-height:1.18}.welcome-copy p{max-width:590px}
.cover{margin:0}.cover img{display:block;width:100%;height:auto;border-radius:3px;box-shadow:0 10px 28px #17182c40}
.welcome-layout .setup-panel{grid-column:1 / -1;margin-top:0}.welcome-layout .setup-panel h2{margin-bottom:5px}
.notice{background:#303955;color:#eff6f3}.notice.warn{background:#453d40}.notice.error{background:#473442}
input[type=text],input[type=url],kbd{background:#282b4a}button{color:#242743}.meter{background:#252742}
.control-notes{font-size:14px;margin:22px 0}.control-notes p{margin-bottom:10px}.skip-controls{margin-top:18px}
body.listening{background:var(--bg)}.listening h1{color:#c3c6dc}.listening .muted,.listening .eyebrow{color:#bec2d8}
@media(max-width:700px){.welcome-layout{grid-template-columns:minmax(0,1fr) 145px;gap:22px}.welcome-layout h1{font-size:28px}}
@media(max-width:480px){.welcome-layout{grid-template-columns:1fr}.cover{width:145px;grid-row:1;justify-self:start}.welcome-layout .setup-panel{grid-column:1}}

const PCM_WORKLET_SOURCE = "/* Raw mono PCM capture. No microphone signal is routed to the speakers. */\nclass LPPCaptureProcessor extends AudioWorkletProcessor {\n  constructor() {\n    super();\n    this.recording = false;\n    this.frames = 0;\n    this.startFrame = 0;\n    this.block = new Float32Array(4096);\n    this.used = 0;\n    this.nextOffset = 0;\n    this.meterFrames = 0;\n    this.meterSquare = 0;\n    this.meterPeak = 0;\n    this.meterClipped = 0;\n    this.missingFrames = 0;\n    this.pendingStart = null;\n    this.port.onmessage = ({data}) => this.command(data);\n  }\n\n  reply(id, value) { this.port.postMessage({type: 'reply', id, ...value}); }\n\n  flush() {\n    if (!this.used) return;\n    const pcm = this.block.slice(0, this.used);\n    this.port.postMessage({type: 'pcm', offset: this.nextOffset, pcm}, [pcm.buffer]);\n    this.nextOffset += this.used;\n    this.used = 0;\n  }\n\n  command(message) {\n    const {id, action} = message;\n    if (action === 'start') {\n      if (this.recording) return this.reply(id, {error: 'A recording is already running.'});\n      this.frames = 0;\n      this.used = 0;\n      this.nextOffset = 0;\n      this.missingFrames = 0;\n      this.recording = true;\n      // Anchor to the first actually captured block, not the delivery time of\n      // a main-thread message between two blocks.\n      this.pendingStart = id;\n    } else if (action === 'mark') {\n      if (!this.recording) return this.reply(id, {error: 'No recording is running.'});\n      // AudioContext.currentTime is quantized to rendering blocks. The supplied\n      // event time estimates the key press in this clock; the recorded marker\n      // is indexed exactly at the returned sample, never by a wall-clock timer.\n      const requested = Number.isFinite(message.audioTime)\n        ? Math.round(message.audioTime * sampleRate) - this.startFrame : this.frames;\n      const sampleIndex = Math.max(0, Math.min(this.frames, requested));\n      this.reply(id, {sampleIndex, timeSec: sampleIndex / sampleRate,\n        commandFrame: currentFrame, requestedSampleIndex: requested});\n    } else if (action === 'stop') {\n      this.recording = false;\n      this.flush();\n      this.reply(id, {frames: this.frames, missingFrames: this.missingFrames,\n        startFrame: this.startFrame, endFrame: currentFrame});\n    } else if (action === 'cancel') {\n      this.recording = false;\n      this.pendingStart = null;\n      this.used = 0;\n      this.reply(id, {});\n    }\n  }\n\n  process(inputs, outputs) {\n    if (this.pendingStart !== null) {\n      this.startFrame = currentFrame;\n      this.reply(this.pendingStart, {startFrame: this.startFrame, sampleRate});\n      this.pendingStart = null;\n    }\n    const channels = inputs[0] || [];\n    const count = outputs[0]?.[0]?.length || channels[0]?.length || 128;\n    // Output stays silent; a connected destination keeps this node processing.\n    for (const channel of outputs[0] || []) channel.fill(0);\n    for (let i = 0; i < count; i++) {\n      let value = 0;\n      if (channels.length) {\n        for (let c = 0; c < channels.length; c++) value += channels[c][i] || 0;\n        value /= channels.length;\n      } else if (this.recording) this.missingFrames++;\n      this.meterSquare += value * value;\n      this.meterPeak = Math.max(this.meterPeak, Math.abs(value));\n      if (Math.abs(value) >= .99) this.meterClipped++;\n      this.meterFrames++;\n      if (this.recording) {\n        this.block[this.used++] = value;\n        this.frames++;\n        if (this.used === this.block.length) this.flush();\n      }\n    }\n    if (this.meterFrames >= sampleRate / 12) {\n      this.port.postMessage({type: 'meter', rms: Math.sqrt(this.meterSquare / this.meterFrames),\n        peak: this.meterPeak, clippedFraction: this.meterClipped / this.meterFrames,\n        inputPresent: channels.length > 0});\n      this.meterFrames = 0;\n      this.meterSquare = 0;\n      this.meterPeak = 0;\n      this.meterClipped = 0;\n    }\n    return true;\n  }\n}\nregisterProcessor('lpp-pcm-capture', LPPCaptureProcessor);\n";

/* AudioWorklet microphone capture and PCM16 WAV output. */
const loadedContexts = new WeakSet();

function measureQuality(samples, sampleRate, missingFrames = 0) {
  let peak = 0, squares = 0, clipped = 0, voiced = 0;
  const frameSize = Math.max(1, Math.round(sampleRate * .02));
  let frameSquares = 0, frameCount = 0, totalWindows = 0;
  for (let i = 0; i < samples.length; i++) {
    const v = samples[i];
    squares += v * v;
    frameSquares += v * v;
    frameCount++;
    peak = Math.max(peak, Math.abs(v));
    if (Math.abs(v) >= .99) clipped++;
    if (frameCount === frameSize || i === samples.length - 1) {
      // A level heuristic, not speech recognition or an intelligibility test.
      if (Math.sqrt(frameSquares / frameCount) >= .008) voiced++;
      totalWindows++;
      frameSquares = 0;
      frameCount = 0;
    }
  }
  const rms = samples.length ? Math.sqrt(squares / samples.length) : 0;
  const clippedFraction = samples.length ? clipped / samples.length : 0;
  const activeFraction = totalWindows ? voiced / totalWindows : 0;
  const warnings = [];
  if (!samples.length || peak < .005 || activeFraction < .02) warnings.push('very_quiet_or_silent');
  if (clippedFraction > .001) warnings.push('clipping');
  if (missingFrames) warnings.push('missing_microphone_frames');
  return {rms, rmsDbFS: rms ? 20 * Math.log10(rms) : null, peak,
    clippedFraction, activeFraction, missingFrames, sampleCount: samples.length,
    durationSec: samples.length / sampleRate, warnings,
    levelCheckPassed: samples.length > 0 && warnings.length === 0};
}

function embedMarkers(samples, sampleRate, markerSampleIndices) {
  const result = samples.slice();
  const length = Math.round(.080 * sampleRate);
  for (const offset of markerSampleIndices) {
    if (!Number.isInteger(offset) || offset < 0) continue;
    for (let i = 0; i < length && offset + i < result.length; i++) {
      const envelope = Math.sin(Math.PI * i / (length - 1)) ** 2;
      result[offset + i] += .5 * Math.sin(2 * Math.PI * 1000 * i / sampleRate) * envelope;
    }

  for (let i = 0; i < result.length; i++) result[i] = Math.max(-1, Math.min(1, result[i]));

/* LocalData */
const LocalData = (() => {
/* Local checkpoints and portable backups. No response audio leaves this module. */
const DB_NAME = 'lpp-audiobook-checkpoints';
const DB_VERSION = 1;

function nonempty(value, label) {
  if (typeof value !== 'string' || !value.trim()) throw new TypeError(`${label} is required.`);
  return value;
}

function openStore() {
  if (opening) return opening;
  opening = new Promise((resolve, reject) => {
    if (!globalThis.indexedDB) {
      reject(new Error('This browser cannot save local checkpoints (IndexedDB is unavailable).'));
      return;
    }
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    let rejected = false;
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains('sessions')) db.createObjectStore('sessions', { keyPath: 'session_id' });
      if (!db.objectStoreNames.contains('recordings')) {
        const store = db.createObjectStore('recordings', { keyPath: ['session_id', 'recording_id'] });
        store.createIndex('session_id', 'session_id', { unique: false });
      }
    };
    request.onblocked = () => {
      rejected = true;
      reject(new Error('Another study tab is blocking local storage. Close the other tab and reload.'));
    };
    request.onerror = () => reject(request.error || new Error('Could not open local storage.'));
    request.onsuccess = () => {
      const db = request.result;
      if (rejected) { db.close(); return; }
      db.onversionchange = () => { db.close(); opening = null; };
      db.onclose = () => { opening = null; };
      resolve(db);
    };
  }).catch(error => { opening = null; throw error; });

}

function makeTransaction(db, stores, mode) {
  // Strict durability asks the browser to flush successful writes to storage.
  // Older implementations do not accept the optional third argument.
  if (mode === 'readwrite') {
    try { return db.transaction(stores, mode, { durability: 'strict' }); }
    catch (error) { if (error.name !== 'TypeError') throw error; }
  }
  return db.transaction(stores, mode);
}

async function transaction(stores, mode, work) {
  const db = await openStore();
  return new Promise((resolve, reject) => {
    let result;
    let workError;
    const tx = makeTransaction(db, stores, mode);
    tx.oncomplete = () => resolve(result);
    tx.onabort = () => reject(workError || tx.error || new Error('Local save was interrupted.'));

    try {
      work(tx, value => { result = value; });
    } catch (error) {
      workError = error;
      try { tx.abort(); } catch (_) { reject(error); }
    }

}

async function saveSession(session) {

async function getSession(id) {

async function listSessions() {

async function crc32(blob) {

const GoogleUpload = (() => {

 * A resolved no-cors POST is NOT confirmation that a file was saved.
 * The app owns persistent sessions/audio in IndexedDB; retrying these calls
 * is safe. This module does not delete the local originals.

const CHUNK_BYTES = 2097152;
const DIRECT_BYTES = 8388608;
const MAX_AUDIO_BYTES = 33554432;
const queues = new Map();
let lastVersion = 0;

function endpointURL(config) {

}
function ensureStudy(session) {

  if (!/^[A-Za-z0-9_-]{8,128}$/.test(session.session_id || '')) throw new Error('Invalid session ID.');
}
function enqueue(key, work) {
  const previous = queues.get(key) || Promise.resolve();
  const pending = previous.catch(() => {}).then(work);
  queues.set(key, pending);
  pending.then(() => { if (queues.get(key) === pending) queues.delete(key); }, () => { if (queues.get(key) === pending) queues.delete(key); });

}

function readReceipt(endpoint, requestId, timeout=12000) {

    const clean = () => { if (ended) return; ended=true; clearTimeout(timer); script.remove(); delete window[callback]; };
    const timer = setTimeout(() => { clean(); reject(new Error('Upload confirmation timed out.')); },timeout);
    window[callback] = value => {
      clean();

      else resolve(value);
    };
    script.onerror = () => { clean(); reject(new Error('Could not read the upload receipt.')); };

    url.searchParams.set('callback',callback);

async function confirmedPost(endpoint, payload) {

    } catch (error) { lastError=error; /* POST may still have committed: ask for its receipt. */ }
    finally { clearTimeout(timer); }
    for (let poll=0; poll<2; poll++) {
      try {
        const receipt = await readReceipt(endpoint,request_id);
        if (receipt.ok && ['accepted','superseded'].includes(receipt.status)) return receipt;
        if (receipt.status==='retryable') { lastError=new Error('Google could not finish this request yet.'); break; }
        if (receipt.status==='rejected') {
          const error = new Error('Server did not accept this upload ('+(receipt.code||'unknown')+'). Your local backup is retained.');

/** recordings use {section, probeNumber, recording_id|id, blob: Blob}. */
function uploadRecording(config, session, recording, onProgress=()=>{}) {

      onProgress('Recording already confirmed · section '+section+', probe '+probeNumber);
      confirmedAudio.set(cacheKey,prior); return prior;
    }

      onProgress('Uploading section '+section+', probe '+probeNumber+' · '+(index+1)+'/'+chunk_count);

function uploadMetadata(config, session, onProgress=()=>{}) {

async function descriptors(session, recordings) {

    const bytes=new Uint8Array(await r.blob.arrayBuffer());
    result.push({section:Number(r.section),probeNumber:Number(r.probeNumber),recording_id:r.recording_id||r.id,

function queueUpload(recording = null) {
  if (!session || session.mode !== 'study' || !endpoint || finalizingDelivery) return;

        if (pendingUploads.size) {

          pendingUploads.delete(key);
          activeRecording = {key, value};

          activeRecording = null;

          const snapshot = latestUploadSnapshot;
          latestUploadSnapshot = null;

      }

      if (activeRecording && !pendingUploads.has(activeRecording.key)) {

    sections.add(section.section);
    for (const trial of section.trials) {
      if (trial.status === 'interrupted_before_recording' && !trial.recording_id && !trial.reportAudioFile) continue;
      if (!Number.isInteger(trial.probeNumber) || trial.probeNumber < 1 || !/^[A-Za-z0-9_.-]{1,128}$/.test(trial.recording_id || '') || seen.has(trial.recording_id)) throw Error('A probe recording reference is missing or duplicated.');
      seen.add(trial.recording_id);

      const canonical = `section${section.section}/probe_${n}_reports.wav`;
      const oldName = `section${section.section}_probe_${n}_${trial.recording_id}_reports.wav`;
      const safePath = p => typeof p === 'string' && !p.startsWith('/') && !p.includes('\\') && !p.split('/').some(x => x === '..' || x === '.');
      const references = [canonical, trial.reportAudioFile, trial.driveAudioFile].filter(safePath);
      const matches = chosen.filter(f => {
        const path = pathOf(f);
        if (!path.startsWith(root)) return false;
        const relative = path.slice(root.length);
        return references.includes(relative) || relative === oldName ||
          (data.file_prefix && relative === `section${section.section}/${data.file_prefix}_section${section.section}_probe_${n}_reports.wav`);
      });

      const file = matches[0], bytes = await file.arrayBuffer(), view = new DataView(bytes);
      const ascii = (offset, count) => String.fromCharCode(...new Uint8Array(bytes, offset, count));
      if (bytes.byteLength < 46 || ascii(0,4) !== 'RIFF' || ascii(8,4) !== 'WAVE' || ascii(12,4) !== 'fmt ' || ascii(36,4) !== 'data' || view.getUint16(20,true) !== 1 || view.getUint16(22,true) !== 1 || view.getUint16(34,true) !== 16 || view.getUint32(40,true) !== bytes.byteLength - 44) throw Error(`Invalid PCM WAV: ${file.name}`);

      if (trial.audioSampleRate && rate !== trial.audioSampleRate) throw Error(`WAV sample rate differs from the saved probe: ${file.name}`);
      if (Number.isFinite(trial.audioDuration_sec) && Math.abs(frames/rate-trial.audioDuration_sec) > 1/rate) throw Error(`WAV duration differs from the saved probe: ${file.name}`);
      const markers = trial.spaceTimes_sec;
      if (!Array.isArray(markers) || markers.length > 3 || markers.some((x,i) => !Number.isFinite(x) || x < 0 || x >= frames/rate || (i && x <= markers[i-1])) || (trial.status === 'complete' && markers.length !== 3)) throw Error(`Invalid report boundaries: ${file.name}`);

        }
      }
      for (const oldAnswer of oldSection.comprehension || []) {
        const nextAnswer = (nextSection.comprehension || []).find(q => q.questionNumber === oldAnswer.questionNumber);
        if (!nextAnswer || ['question','response','confidence'].some(k => oldAnswer[k] != null && oldAnswer[k] !== nextAnswer[k])) {
          throw Error('This browser has different or additional comprehension answers. Nothing was replaced.');
        }
      }
    }
    // Local delivery/recovery details may be newer than the downloaded copy.
    data.meta = {...existing.meta, ...data.meta};
    if (existing.meta?.deliveryConfirmedAt) data.meta.deliveryConfirmedAt = existing.meta.deliveryConfirmedAt;
  }
  data.meta ||= {};
  data.meta.backupRestoredAt = new Date().toISOString();
  if (data.status === 'in_progress') {
    data.status = 'aborted'; data.endISO ||= new Date().toISOString(); data.meta.abortReason = 'backup_recovery';
    for (const s of data.sections) if (s.status !== 'complete') { s.status='aborted'; s.endTime=data.endISO; }
  }
  for (const recording of recordings) await saveRecording(data.session_id,recording);
  await saveSession(data);
  return {data, count:recordings.length};
}

async function runMicTest() {

  const remainingMs = Math.max(0, CONFIG.MAX_REPORT_SECONDS * 1000 - retainedMs);
  reportTimeout = setTimeout(() => {
    if (practice) void safe(cancelPractice)();

/* Response correction keeps three accepted boundaries in one canonical WAV.
 * Raw PCM stays in memory only; local/server JSON never contains these samples.
 * The immediately preceding probe remains editable until the next bell or
 * until the participant opens the comprehension questions.
 */
let reportPrefix = new Float32Array(0);
let acceptedReportMarkers = [];
let pendingEditableProbe = null;
let pendingPracticeResult = null;
let storyRun = null;
let resumeStoryAt = null;
let backBusy = false;
let backQueued = false;

function combinePCM(prefix, tail) {
  const pcm = new Float32Array(prefix.length + tail.length);
  pcm.set(prefix); pcm.set(tail, prefix.length);
  return pcm;
}

  if (!(pcm instanceof Float32Array) || !Array.isArray(markers) ||

      !Number.isInteger(rate) || rate < 8000) throw Error('Invalid response correction.');
  const kept = markers.slice(0, target);
  if (kept.some((n, i) => !Number.isInteger(n) || n < 0 || n >= pcm.length || (i && n <= kept[i - 1])))
    throw Error('Invalid accepted response boundaries.');
  const end = target ? Math.min(pcm.length, kept[target - 1] + Math.round(.08 * rate)) : 0;
  return {pcm: pcm.slice(0, end), markers: kept, removedSamples: pcm.length - end};
}
function resetReportTake() {
  reportPrefix = new Float32Array(0);
  acceptedReportMarkers = [];
  backQueued = false;
  pendingPracticeResult = null;
}
function reportResult(pcm, indices, template) {
  const quality = Recording.measureQuality(pcm, template.sampleRate, template.quality?.missingFrames || 0);
  const technical = (template.quality?.warnings || []).filter(x => !['very_quiet_or_silent', 'clipping'].includes(x));
  quality.warnings = [...new Set([...quality.warnings, ...technical])];
  quality.levelCheckPassed = quality.levelCheckPassed && technical.length === 0;
  return {...template, rawPCM: pcm,
    blob: Recording.makeWav(Recording.embedMarkers(pcm, template.sampleRate, indices), template.sampleRate),
    durationSec: pcm.length / template.sampleRate,
    spaceTimes_sec: indices.map(i => i / template.sampleRate),
    markerSampleIndices: indices.slice(), markerSampleIndices1Based: indices.map(i => i + 1),

}
async function finishReportTake() {
  return assembleReportTake(await finishCapture({embed: false}));
}
function sealPendingProbe() {

  queueUpload(pending.recording);
}
function correctionPrompt(index) {
  return ['Recall the phrase.', 'Say “on-task,” “mind-wandering,” or “mind-blanking.”', 'Say your sleepiness rating, from 1 to 9.'][index];
}
function correctionAvailable() {
  if (abortBusy || session?.endISO) return false;
  if (['reports', 'report_tail', 'saving'].includes(state)) return reportIndex > 0;

  return state === 'practice_done' && !practicePassed && Boolean(pendingPracticeResult);
}
async function goBackReport() {

    backQueued = true;
    return;
  }
  backBusy = true;
  backQueued = false;

  const previousReport = reportIndex;
  reportBusy = true;
  state = 'back'; // Block Space before awaiting a recorder stop or local write.
  const own = ++token;

    if (previousState === 'practice_done') {

      practicePassed = false;

      result = pendingPracticeResult;
      pendingPracticeResult = null;
      target = 2;
    } else if (['story', 'questions_intro'].includes(previousState)) {
      const pending = pendingEditableProbe;

          storyRun.start + Math.max(0, ctx.currentTime - storyRun.when)));
      } else resumeStoryAt = null;
      stopAudio();
      storyRun = null;
      window.speechSynthesis?.cancel();
      result = pending.result;
      currentTrial = pending.trial;
      probeIndex = pending.probeIndex;
      pendingEditableProbe = null;
      target = 2;

      target = Math.max(0, previousReport - 1);
      result = await finishReportTake();

    if (result.partial) throw Error('The recording was interrupted; this response cannot be corrected safely.');
    const cut = cutReportTake(result.rawPCM, result.markerSampleIndices, target, result.sampleRate);
    reportPrefix = cut.pcm;
    acceptedReportMarkers = cut.markers;
    reportIndex = target;
    reportBusy = true;
    captureCycle = null;
    state = 'back';

      const correction = {report: target + 1, previousState,

        resumedStoryPosition_sec: resumeStoryAt, iso: new Date().toISOString()};

      // must preserve an explicitly partial take, not an already discarded answer.

      // prefix is checkpointed as one real captured sample and zero answers;
      // it is never carried into the corrected final timeline.
      const checkpointPCM = cut.pcm.length ? cut.pcm : result.rawPCM.slice(0, 1);
      const prefixResult = reportResult(checkpointPCM, cut.markers, result);
      currentTrial.acceptedReportCount = cut.markers.length;

      if (own !== token || session?.endISO) return;

    try { await speak('Back. Close your eyes. ' + correctionPrompt(target) + ' Speak, then press Space.'); }
    catch (error) { if (own === token) throw error; return; }
    if (own !== token || session?.endISO) return;
    await beginCapture();
    if (own !== token || session?.endISO) return;
    state = 'reports';
    reportBusy = false;
    waitRelease = held.has('Space');
    armReportTimeout();
  } finally {
    backBusy = false;
  }
}


async function markReport() {
  if (reportBusy || state !== 'reports' || waitRelease) return;
  reportBusy = true;
  const own = token;
  const marker = await recorder.mark(ctx.currentTime);
  if (own !== token) return;
  const sampleIndex = reportPrefix.length + marker.sampleIndex;
  const previous = acceptedReportMarkers.at(-1);
  if (previous !== undefined && sampleIndex <= previous) throw Error('Response markers are not in chronological order.');
  acceptedReportMarkers.push(sampleIndex);
  if (!practice) event('space', {
    report: reportIndex + 1,
    spaceTime_sec: sampleIndex / ctx.sampleRate,
    sampleIndex,
    captureSampleIndex: marker.sampleIndex
  });
  reportIndex++;
  await play(beepBuffer(), {when: ctx.currentTime});
  if (own !== token || state !== 'reports') return;
  reportBusy = false;
  if (backQueued) {
    await goBackReport();
    return;
  }
  if (reportIndex === 3) {
    state = 'report_tail';
    await sleep(1000);
    if (own !== token || state !== 'report_tail') return;
    state = 'saving';
    reportBusy = true;
    const result = await finishReportTake();
    if (own !== token) return;
    clearTimeout(reportTimeout);
    if (practice) {
      pendingPracticeResult = result;
      reportBusy = false;
      await practiceDone(result);
      if (backQueued) await goBackReport();
    } else {
      await saveProbe(result, 'complete');
      if (!alive(own)) return;
      reportBusy = false;
      probeIndex++;
      // A Back press during the atomic save reopens the just-saved KSS before
      // any subsequent story audio is started.
      if (backQueued) {
        state = probeIndex < manifest.sections[sectionIndex].probes.length ? 'story' : 'questions_intro';
        storyRun = null;
        await goBackReport();
      } else await nextProbe();
    }
  } else {
    waitRelease = held.has('Space');
    if (practice && $('practicePrompt')) $('practicePrompt').textContent = correctionPrompt(reportIndex);
  }
}

/* Introductory questions are rendered from INTRO_QUESTIONS; no extra event handler

function validateIntroQuestions() {
  const seen = new Set();
  for (const q of INTRO_QUESTIONS) {
    if (!/^[a-z][a-z0-9_]{0,63}$/.test(q.id || '') || seen.has(q.id) || !q.label || !['select','text'].includes(q.type) || typeof q.required !== 'boolean') throw Error('Each introductory question needs a unique id, label, supported type, and required flag.');
    if (q.type === 'select' && (!Array.isArray(q.options) || !q.options.length || q.options.some(option => typeof option !== 'string' || !option) || new Set(q.options).size !== q.options.length)) throw Error('Select questions need unique, nonempty options.');
    seen.add(q.id);
  }
}
function introQuestionFields() {
  validateIntroQuestions();
  return INTRO_QUESTIONS.map(q => `<label class="field" for="intro_${q.id}">${escape(q.label)}${q.required ? ' (required)' : ' (optional)'}</label>${q.type === 'select'
    ? `<select id="intro_${q.id}" ${q.required ? 'required' : ''}><option value="">Select an answer</option>${q.options.map(option => `<option value="${escape(option)}">${escape(option)}</option>`).join('')}</select>`
    : `<input type="text" id="intro_${q.id}" maxlength="500" autocomplete="off" ${q.required ? 'required' : ''}>`}`).join('');
}
function readIntroAnswers() {
  const answers = {};
  for (const q of INTRO_QUESTIONS) {
    const value = $('intro_' + q.id).value.trim();
    if (q.required && !value) throw Error('Please answer: ' + q.label);
    if (value && q.type === 'select' && !q.options.includes(value)) throw Error('Please select one of the listed answers: ' + q.label);
    if (value.length > 500) throw Error('Please shorten your answer: ' + q.label);
    answers[q.id] = value || null;
  }
  return answers;
}

function speak(text) {
  return new Promise((resolve, reject) => {
    if (!('speechSynthesis' in window)) {
      reject(Error('Spoken eyes-closed guidance is unavailable in this browser. Use another desktop browser.'));
      return;
    }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = .95;
    u.onend = () => {
      clearTimeout(timer);
      resolve();
    };
    u.onerror = e => {
      clearTimeout(timer);
      reject(Error('Spoken guidance failed: ' + e.error));
    };
    const timer = setTimeout(() => {
      speechSynthesis.cancel();
      reject(Error('Spoken guidance timed out. Check browser audio.'));
    }, 20000);
    speechSynthesis.speak(u);
  });
}
async function nextProbe() {

  const own = token,
    p = s.probes[probeIndex],
    audio = buffers.get(s.audiobookFile),
    naturalStart = probeIndex === 0 ? 0 : sampleBoundary(s.probes[probeIndex - 1].effectiveProbeTime_sec, ctx.sampleRate),
    end = sampleBoundary(p.effectiveProbeTime_sec, ctx.sampleRate),

async function saveProbe(result, trialStatus) {
  Object.assign(currentTrial, {
    acceptedReportCount: result.markerSampleIndices.length,
    interruptedDuringCorrection: trialStatus !== 'complete' && Boolean(currentTrial.correctionCount),
    spaceTimes_sec: result.spaceTimes_sec,
    spaceSampleIndices: result.markerSampleIndices,
    audioSampleRate: result.sampleRate,
    audioDuration_sec: result.durationSec,
    quality: result.quality,
    recording_id: `section${sectionInfo.section}_probe${String(currentTrial.probeNumber).padStart(3,'0')}`,
    status: result.partial ? 'partial' : trialStatus,
    recordingPartial: result.partial || trialStatus !== 'complete',
    markerTiming: result.markerTiming
  });
  const existing = sectionInfo.trials.findIndex(t => t.probeNumber === currentTrial.probeNumber);
  if (existing < 0) sectionInfo.trials.push(currentTrial);
  else sectionInfo.trials[existing] = currentTrial;
  const recording = {
    recording_id: currentTrial.recording_id,
    section: sectionInfo.section,
    probeNumber: currentTrial.probeNumber,
    filename: currentTrial.reportAudioFile,
    blob: result.blob,
    sampleRate: result.sampleRate,
    durationSec: result.durationSec,
    trial: structuredClone(currentTrial)
  };
  volatileRecordings.set(session.session_id + '/' + recording.recording_id, recording);
  event('probe_saved', {status: currentTrial.status, quality: result.quality});
  try {
    await saveProbeCheckpoint(session, recording);
  } catch (e) {
    saveError = e;
    throw Error('This probe could not be saved in the browser. Download the backup before closing this tab. ' + e.message);
  }
  if (trialStatus === 'complete' && !result.partial && !session.endISO) {
    pendingEditableProbe = {trial: currentTrial, recording, result, probeIndex};
  }
  if (result.partial && trialStatus === 'complete') {
    await abortStudy('partial_audio', 'The recording was interrupted. Your saved responses remain available.');
  }
}

    await checkpoint();

    saveError = e;

    await recorder?.dispose();

  recorder = null;
  captureCycle = null;

      DATA_ENDPOINT: endpoint
    }, session, await availableRecordings(), text => {
      if ($('saveNotice')) $('saveNotice').innerHTML = notice(escape(typeof text === 'string' ? text : JSON.stringify(text)));
    });
    session.meta.deliveryConfirmedAt = new Date().toISOString();
    session.meta.deliveryAudit = {expected:delivery.audit.expected,received:delivery.audit.received};
    await checkpoint();
    if ($('saveNotice')) $('saveNotice').innerHTML = notice('Delivery confirmed: '+delivery.audit.received+'/'+delivery.audit.expected+' recordings and your response data are saved. You may close this tab.');
  } catch (e) {
    uploadProblem = e.message;
    if ($('saveNotice')) $('saveNotice').innerHTML = notice('Delivery is not confirmed. Your saved data is still available here. Retry, or download the complete backup and contact ' + escape(CONFIG.CONTACT_EMAIL) + '. ' + escape(e.message), 'warn');
  } finally {
    finalUploading = false;
    if (button) button.disabled = false;
  }
}
async function recoverSession(id) {
  let recovered = await getSession(id);
  const recordings = await availableRecordings(id);
  recovered = reconcileSessionRecordings(recovered, recordings);
  if (recovered.status === 'in_progress') {
    recovered.status = 'aborted';
    recovered.endISO = new Date().toISOString();
    recovered.meta.abortReason = 'reload_recovery';
    for (const info of recovered.sections)
      if (info.status !== 'complete') {
        info.status = 'aborted';
        info.endTime = recovered.endISO;
      }
  }
  await saveSession(recovered);
  return {
    recovered,
    recordings
  };
}
async function researcherSettings() {
  if (activeStudy() || running() || practice || state === 'mic_check' || recorder?.recording || recorder?.recordingBusy) return;
  const saved = await listSessions();
  $('settingsContent').innerHTML = `<p class="eyebrow">Researcher settings</p><h2>Setup &amp; saved sessions</h2>
    <p class="small">Set the Apps Script URL in <code>CONFIG.DATA_ENDPOINT</code> near the top of <code>index.html</code>. Run <code>LPP_web.m</code> once to prepare the HTML and original audio, then upload <code>index.html</code> and the <code>assets</code> folder to GitHub.</p>
    ${manifest?notice('Study loaded: section'+(manifest.sections.length === 1 ? ' ' : 's ')+manifest.sections.map(s => s.section).join(', ')+', '+manifest.sections.reduce((n,s)=>n+s.probes.length,0)+' fixed probes.'):notice('Study audio and timings have not been added yet. Microphone checks and practice are available.','warn')}
    <p id="folderStatus" class="small">${escape(packageError)}</p>
    <label class="field" for="endpointInput">Apps Script /exec URL (override for this tab only)</label><input id="endpointInput" type="url" value="${escape(endpoint)}" placeholder="https://script.google.com/macros/s/.../exec">
    <label class="check"><input type="checkbox" id="localMode" ${localRehearsal?'checked':''}><span>Rehearsal only: download responses instead of uploading.</span></label><button id="applySettings">Apply settings</button>
    <h3>Restore a downloaded backup</h3><p class="small">Unzip the participant download, then select its whole folder. This checks and restores the data locally; use Retry delivery below to send missing recordings.</p><input id="restoreFolder" class="file-input" type="file" webkitdirectory multiple><button id="restoreBackup" class="secondary">Restore selected folder</button><p id="restoreStatus" class="small" role="status"></p>
    <h3>Saved sessions on this browser</h3><p class="small">Download or resend an interrupted session here. Keep a backup until its Google upload is confirmed.</p>
    <div id="savedSessions">${saved.length?saved.map((s,i)=>`<div class="session-item"><strong>${escape(s.participant_id)} · ${escape(s.status)}</strong><p class="small">${escape(s.startISO)} · ${escape(s.mode)}</p><div class="row"><button class="secondary" id="backup${i}">Download backup</button><button class="secondary" id="send${i}" ${s.mode==='study'?'':'disabled'}>Retry delivery</button><button class="danger" id="delete${i}">Delete local copy</button></div><p class="small" id="savedStatus${i}"></p></div>`).join(''):'<p class="small">No saved sessions yet.</p>'}</div>`;
  $('settings').showModal();
  bind('restoreBackup', async () => {
    try {
      $('restoreStatus').textContent = 'Checking the session and WAV files…';
      const restored = await restoreBackupFolder($('restoreFolder').files);
      $('settings').close();
      await researcherSettings();
      $('restoreStatus').textContent = restored.count+' recordings restored for '+restored.data.participant_id+'. Use Retry delivery below.';
    } catch (error) { $('restoreStatus').textContent = error.message; }
  });
  bind('applySettings', () => {
    const input = $('endpointInput').value.trim();
    if (input && !/^https:\/\/script\.google\.com\/macros\/s\/[-\w]+\/exec$/.test(input)) {
      $('folderStatus').textContent = 'Use the deployed Google Apps Script /exec URL.';
      return;
    }
    endpoint = input;
    localRehearsal = $('localMode').checked;
    $('settings').close();
    status();
    if (practiceStepAccepted() && microphoneStepAccepted()) screenStudyGate();
    else screenWelcome();
  });
  for (const [i, s] of saved.entries()) {
    bind('backup' + i, async () => {
      const {
        recovered,
        recordings
      } = await recoverSession(s.session_id);
      const backup = await downloadSessionZip(recovered, recordings);
      $('savedStatus' + i).textContent = backup.backupStatus.complete ? 'Backup prepared with all referenced recordings.' : 'Partial backup: missing recordings are listed in backup-status.json.';
    });
    bind('send' + i, async () => {
      if (finalUploading) { $('savedStatus' + i).textContent = 'Wait for the current delivery check to finish.'; return; }
      if (!endpoint) {
        $('savedStatus' + i).textContent = 'Set and apply the Apps Script endpoint first.';
        return;
      }
      finalUploading = true;
      $('closeSettings').disabled = true;
      try {
        const {recovered: savedSession, recordings} = await recoverSession(s.session_id);
        const delivery = await submitSession({
          DATA_ENDPOINT: endpoint
        }, savedSession, recordings, t => $('savedStatus' + i).textContent = typeof t === 'string' ? t : JSON.stringify(t));
        savedSession.meta.deliveryConfirmedAt = new Date().toISOString();
        savedSession.meta.deliveryAudit = {expected:delivery.audit.expected,received:delivery.audit.received};
        await saveSession(savedSession);
        $('savedStatus' + i).textContent = 'Delivery confirmed: '+delivery.audit.received+'/'+delivery.audit.expected+' recordings and response data.';
      } catch (e) {
        $('savedStatus' + i).textContent = 'Not confirmed: ' + e.message;
      } finally { finalUploading = false; $('closeSettings').disabled = false; }
    });
    bind('delete' + i, async () => {
      if (confirm('Delete the data and voice recordings from this browser? Download a backup first. This does not delete the researcher’s copy.')) {
        await deleteSession(s.session_id);
        $('settings').close();
        await researcherSettings();
      }
    });
  }
}
document.addEventListener('keydown', e => {
  const already = held.has(e.code);
  held.add(e.code);
  if (e.repeat) {
    if ((running() || practice) && ['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
    return;
  }
  if (e.code === 'Escape') {
    void leaveFullscreen();
    return;
  }
  if (e.code === 'KeyQ' && activeStudy() && !['INPUT','TEXTAREA'].includes(e.target?.tagName)) {
    e.preventDefault();
    void abortStudy('participant_stop');
    return;
  }
  if (e.code === 'KeyQ' && practice) {
    e.preventDefault();
    void safe(cancelPractice)();
    return;
  }
  if (e.code === 'ArrowLeft' && !already && correctionAvailable()) {
    e.preventDefault();
    void safe(goBackReport)();
    return;
  }
  if (responseAllowed(state, e, already || waitRelease, reportBusy)) {
    e.preventDefault();
    void safe(markReport)();
    return;
  }
  if ((running() || practice) && ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
    e.preventDefault();
    return;
  }
  if (questionKey && /^[1-4]$/.test(e.key)) {
    e.preventDefault();
    questionKey(Number(e.key));
  }
});
document.addEventListener('keyup', e => {
  held.delete(e.code);
  if (e.code === 'Space') {
    waitRelease = false;
    if (running() || practice) e.preventDefault();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    held.clear();
    if (practice) void safe(cancelPractice)();
    if (activeStudy() && running()) void abortStudy('tab_hidden', 'The study stopped because this tab was hidden. Your completed responses have been saved.');
  }
});
window.addEventListener('blur', () => {
  held.clear();
  if (activeStudy() && running()) event('window_blur');
});
window.addEventListener('beforeunload', e => {
  if (activeStudy() || finalUploading || uploadWorkerRunning) {
    e.preventDefault();
    e.returnValue = '';
  }
});
$('researcherToggle').onclick = safe(researcherSettings);
$('closeSettings').onclick = () => {
  if (finalUploading) return;
  $('settings').close();
  $('settingsContent').querySelectorAll('audio').forEach(a => a.pause());
};
$('settings').addEventListener('cancel', e => { if (finalUploading) e.preventDefault(); });
async function boot() {
  await openStore();
  try {
    validateIntroQuestions();
    if (EMBEDDED_STUDY) manifest = configureManifest(EMBEDDED_STUDY);
    else packageError = 'Run LPP_web.m → Prepare website to add the original study files.';
  } catch (e) {
    packageError = e.message;
  }
  status();
  screenWelcome();
}
void safe(boot)();

</script></body></html>
