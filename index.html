          const error = new Error('Server did not accept this upload ('+(receipt.code||'unknown')+'). Your local backup is retained.');
          error.serverRejection=true; throw error;
        }
      } catch (error) {
        if (error.serverRejection) throw error;
        lastError=error;
      }
      await delay(Math.min(1000*(poll+1),4000));
    }
  }
  throw new Error('Upload was not confirmed. Keep this tab or download the backup, then retry. '+(lastError?.message||''));
}

/** recordings use {section, probeNumber, recording_id|id, blob: Blob}. */
function uploadRecording(config, session, recording, onProgress=()=>{}) {
  ensureStudy(session);
  const endpoint=endpointURL(config), sid=session.session_id;
  const section=Number(recording.section), probeNumber=Number(recording.probeNumber);
  const trial=session.sections?.find(x=>x.section===section)?.trials?.find(x=>x.probeNumber===probeNumber);
  const recording_id=recording.recording_id || recording.id || trial?.recording_id;
  if (!/^[A-Za-z0-9_.-]{1,128}$/.test(recording_id||'')) throw new Error('Recording ID is missing or invalid.');
  const blob=recording.blob;
  if (!(blob instanceof Blob) || blob.size<44 || blob.size>MAX_AUDIO_BYTES) throw new Error('Recording exceeds the upload limit or is missing. Download the original backup.');
  return enqueue(endpoint+sid,async()=>{
    const bytes=new Uint8Array(await blob.arrayBuffer()), hash=await sha256(bytes);
    const chunk_count=Math.ceil(bytes.length/CHUNK_BYTES);
    const base={mode:'study',session_id:sid,section,probeNumber,recording_id,sha256:hash,total_bytes:bytes.length,chunk_count};
    const prior=await confirmedPost(endpoint,{...base,action:'audio_status'});
    if (prior.exists) {
      if(prior.sha256!==hash || prior.bytes!==bytes.length) throw new Error('Saved audio checksum does not match the local recording.');
      onProgress('Recording already confirmed · section '+section+', probe '+probeNumber);
      return prior;
    }
    for (let index=0;index<chunk_count;index++) {
      onProgress('Uploading section '+section+', probe '+probeNumber+' · '+(index+1)+'/'+chunk_count);
      const part=bytes.subarray(index*CHUNK_BYTES,Math.min(bytes.length,(index+1)*CHUNK_BYTES));
      await confirmedPost(endpoint,{...base,action:'chunk',index,data:bytesToBase64(part)});
    }
    const receipt=await confirmedPost(endpoint,{...base,action:'audio'});
    if (receipt.sha256!==hash || receipt.bytes!==bytes.length) throw new Error('Saved audio checksum does not match the local recording.');
    onProgress('Recording confirmed · section '+section+', probe '+probeNumber);
    return receipt;
  });
}

/** Capture the JSON snapshot immediately, before waiting for earlier uploads. */
function uploadMetadata(config, session, onProgress=()=>{}) {
  ensureStudy(session);
  const endpoint=endpointURL(config), snapshot=JSON.parse(JSON.stringify(session));
  lastVersion=Math.max(Date.now(),lastVersion+1);
  const version=lastVersion;
  return enqueue(endpoint+session.session_id,async()=>{
    onProgress('Saving response table…');
    const receipt=await confirmedPost(endpoint,{action:'metadata',mode:'study',session_id:snapshot.session_id,snapshot_version:version,session:snapshot});
    if (receipt.status==='superseded') throw new Error('The server has a newer session snapshot. This snapshot was not saved; retain the backup and have the researcher compare it.');
    onProgress('Response table confirmed.');
    return receipt;
  });
}

/** Retry every local recording; server hashes and stable IDs prevent duplicates. */
async function submitSession(config, session, recordings, onProgress=()=>{}) {
  ensureStudy(session);
  validateRecordingReferences(session, recordings);
  const receipts=[];
  for (const recording of recordings) receipts.push(await uploadRecording(config,session,recording,onProgress));
  const metadata=await uploadMetadata(config,session,onProgress);
  return {ok:true,recordings:receipts,metadata};
}

/** Final delivery is not complete if any captured WAV is absent from the set. */
function validateRecordingReferences(session, recordings) {
  if (!Array.isArray(recordings) || !Array.isArray(session.sections)) throw new Error('Session recordings are missing. Keep the backup.');
  const seen = new Set();
  for (const section of session.sections) {
    if (!Array.isArray(section.trials)) throw new Error('Session probe records are missing.');
    for (const trial of section.trials) {
      const referenced = Boolean(trial.recording_id || trial.reportAudioFile);
      if (!referenced) {
        if (trial.status !== 'interrupted_before_recording') throw new Error('A probe is missing its recording reference. Delivery is not confirmed.');
        continue;
      }
      if (!trial.recording_id || !trial.reportAudioFile) throw new Error('A captured probe has an incomplete recording reference. Delivery is not confirmed.');
      const key = section.section + ':' + trial.probeNumber + ':' + trial.recording_id;
      if (seen.has(key)) throw new Error('Duplicate probe recording reference. Delivery is not confirmed.');
      seen.add(key);
      const matches = recordings.filter(r => Number(r.section) === Number(section.section) && Number(r.probeNumber) === Number(trial.probeNumber) && (r.recording_id || r.id) === trial.recording_id);
      if (matches.length !== 1 || !(matches[0].blob instanceof Blob) || matches[0].blob.size < 44) {
        throw new Error('The WAV for section ' + section.section + ', probe ' + trial.probeNumber + ' is missing or ambiguous. Delivery is not confirmed; preserve this tab and any downloaded backup.');
      }
    }
  }
  return true;
}

return {CHUNK_BYTES, MAX_AUDIO_BYTES, endpointURL, sha256, bytesToBase64, uploadRecording, uploadMetadata, submitSession, validateRecordingReferences};
})();

function probeBuffer(p) {
  const bell = buffers.get(manifest.bellFile),
    cue = buffers.get(p.cueAudioFile),
    gap = Math.round(manifest.beepToCueDelay * ctx.sampleRate),
    out = ctx.createBuffer(cue.numberOfChannels, bell.length + gap + cue.length, ctx.sampleRate);
  for (let c = 0; c < out.numberOfChannels; c++) {
    const d = out.getChannelData(c);
    for (let i = 0; i < bell.length; i++) {
      let v = 0;
      for (let k = 0; k < bell.numberOfChannels; k++) v += bell.getChannelData(k)[i];
      d[i] = v / bell.numberOfChannels;

    d.set(cue.getChannelData(c), bell.length + gap);

function speak(text) {
  return new Promise((resolve, reject) => {
    if (!('speechSynthesis' in window)) {
      reject(Error('Spoken eyes-closed guidance is unavailable in this browser. Use another desktop browser.'));
      return;
    }
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = .95;
    u.onend = () => {
      clearTimeout(timer);
      resolve();
    };
    u.onerror = e => {
      clearTimeout(timer);
      reject(Error('Spoken guidance failed: ' + e.error));
    };
    const timer = setTimeout(() => {
      speechSynthesis.cancel();
      reject(Error('Spoken guidance timed out. Check browser audio.'));
    }, 20000);
    speechSynthesis.speak(u);
  });
}

async function saveProbe(result, trialStatus) {
  Object.assign(currentTrial, {
    spaceTimes_sec: result.spaceTimes_sec,
    spaceSampleIndices: result.markerSampleIndices,
    audioSampleRate: result.sampleRate,
    audioDuration_sec: result.durationSec,
    quality: result.quality,
    recording_id: `section${sectionInfo.section}_probe${String(currentTrial.probeNumber).padStart(3,'0')}`,
    status: result.partial ? 'partial' : trialStatus,
    recordingPartial: result.partial,
    markerTiming: result.markerTiming
  });
  if (!sectionInfo.trials.some(t => t.probeNumber === currentTrial.probeNumber)) sectionInfo.trials.push(currentTrial);
  const recording = {
    recording_id: currentTrial.recording_id,
    section: sectionInfo.section,
    probeNumber: currentTrial.probeNumber,
    filename: currentTrial.reportAudioFile,
    blob: result.blob,
    sampleRate: result.sampleRate,
    durationSec: result.durationSec,
    trial: structuredClone(currentTrial)
  };
  volatileRecordings.set(session.session_id + '/' + recording.recording_id, recording);
  event('probe_saved', {
    status: currentTrial.status,
    quality: result.quality
  });
  try {
    await saveProbeCheckpoint(session, recording);
  } catch (e) {
    saveError = e;
    throw Error('This probe could not be saved in the browser. Download the backup before closing this tab. ' + e.message);
  }
  queueUpload(recording);
  if (result.partial && trialStatus === 'complete') {
    await abortStudy('partial_audio', 'The recording was interrupted. Your saved responses remain available.');
  }
}

async function abortStudy(reason, message = '') {

  abortBusy = true;
  ++token;

  window.speechSynthesis?.cancel();

  state = 'aborted';
  setListening(false);
  questionKey = null;

  session.endISO = new Date().toISOString();

    sectionInfo.status = 'aborted';

  }
  event('session_aborted', {
    reason,
    message
  });

    if (captureCycle && currentTrial && (recorder?.recording || recorder?.recordingBusy)) {
      const result = await finishCapture();
      await saveProbe(result, 'partial');
    } else if (currentTrial && !sectionInfo.trials.some(t => t.probeNumber === currentTrial.probeNumber)) {
      currentTrial.status = 'interrupted_before_recording';
      currentTrial.reportAudioFile = '';
      sectionInfo.trials.push(currentTrial);
    }
  } catch (e) {
    saveError = e;
  }
  try {
    await checkpoint();
  } catch (e) {
    saveError = e;
  }
  try {
    await recorder?.dispose();
  } catch {}
  recorder = null;
  captureCycle = null;

async function recoverSession(id) {

    for (const info of recovered.sections)
      if (info.status !== 'complete') {

  await saveSession(recovered);
  return {
    recovered,
    recordings
  };
}

    <label class="check"><input type="checkbox" id="localMode" ${localRehearsal?'checked':''}><span>Rehearsal only: download responses instead of uploading.</span></label><button id="applySettings">Apply settings</button>
    <h3>Saved sessions on this browser</h3><p class="small">Download or resend an interrupted session here. Keep a backup until its Google upload is confirmed.</p>
    <div id="savedSessions">${saved.length?saved.map((s,i)=>`<div class="session-item"><strong>${escape(s.participant_id)} · ${escape(s.status)}</strong><p class="small">${escape(s.startISO)} · ${escape(s.mode)}</p><div class="row"><button class="secondary" id="backup${i}">Download backup</button><button class="secondary" id="send${i}" ${s.mode==='study'?'':'disabled'}>Retry delivery</button><button class="danger" id="delete${i}">Delete local copy</button></div><p class="small" id="savedStatus${i}"></p></div>`).join(''):'<p class="small">No saved sessions yet.</p>'}</div>`;
  $('settings').showModal();
  bind('applySettings', () => {
    const input = $('endpointInput').value.trim();
    if (input && !/^https:\/\/script\.google\.com\/macros\/s\/[-\w]+\/exec$/.test(input)) {
      $('folderStatus').textContent = 'Use the deployed Google Apps Script /exec URL.';
      return;
    }
    endpoint = input;
    localRehearsal = $('localMode').checked;
    $('settings').close();
    status();
    if (practicePassed) screenStudyGate();
    else screenWelcome();
  });
  for (const [i, s] of saved.entries()) {
    bind('backup' + i, async () => {
      const {
        recovered,
        recordings
      } = await recoverSession(s.session_id);
      const backup = await downloadSessionZip(recovered, recordings);
      $('savedStatus' + i).textContent = backup.backupStatus.complete ? 'Backup prepared with all referenced recordings.' : 'Partial backup: missing recordings are listed in backup-status.json.';
    });
    bind('send' + i, async () => {
      if (!endpoint) {
        $('savedStatus' + i).textContent = 'Set and apply the Apps Script endpoint first.';
        return;
      }
      const {
        recovered: savedSession,
        recordings
      } = await recoverSession(s.session_id);
      try {
        await submitSession({
          DATA_ENDPOINT: endpoint
        }, savedSession, recordings, t => $('savedStatus' + i).textContent = typeof t === 'string' ? t : JSON.stringify(t));
        $('savedStatus' + i).textContent = 'Delivery confirmed.';
      } catch (e) {
        $('savedStatus' + i).textContent = 'Not confirmed: ' + e.message;
      }
    });
    bind('delete' + i, async () => {
      if (confirm('Delete the data and voice recordings from this browser? Download a backup first. This does not delete the researcher’s copy.')) {
        await deleteSession(s.session_id);
        $('settings').close();
        await researcherSettings();
      }
    });
  }
}
document.addEventListener('keydown', e => {
  const already = held.has(e.code);
  held.add(e.code);
  if (e.repeat) return;
  if (e.code === 'Escape' && activeStudy()) {
    e.preventDefault();
    void abortStudy('participant_escape');
    return;
  }
  if (e.code === 'Escape' && practice) {
    e.preventDefault();
    void safe(cancelPractice)();
    return;
  }
  if (responseAllowed(state, e, already || waitRelease, reportBusy)) {
    e.preventDefault();
    void safe(markReport)();
    return;
  }
  if ((running() || practice) && ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
    e.preventDefault();
    return;
  }
  if (questionKey && /^[1-4]$/.test(e.key)) {
    e.preventDefault();
    questionKey(Number(e.key));
  }
});
document.addEventListener('keyup', e => {
  held.delete(e.code);
  if (e.code === 'Space') {
    waitRelease = false;
    if (running() || practice) e.preventDefault();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    held.clear();
    if (activeStudy() && running()) void abortStudy('tab_hidden', 'The study stopped because this tab was hidden. Your completed responses have been saved.');
  }
});
window.addEventListener('blur', () => {
  held.clear();
  if (activeStudy() && running()) event('window_blur');
});
window.addEventListener('beforeunload', e => {
  if (activeStudy()) {
    e.preventDefault();
    e.returnValue = '';
  }
});
$('researcherToggle').onclick = safe(researcherSettings);
$('closeSettings').onclick = () => {
  $('settings').close();
  $('settingsContent').querySelectorAll('audio').forEach(a => a.pause());
};
async function boot() {
  await openStore();
  try {
    if (EMBEDDED_STUDY) manifest = validateManifest(EMBEDDED_STUDY);
    else packageError = 'Run LPP_web.m → Prepare website to add the original study files.';
  } catch (e) {
    packageError = e.message;
  }
  status();
  screenWelcome();
}
void safe(boot)();

</script></body></html>
